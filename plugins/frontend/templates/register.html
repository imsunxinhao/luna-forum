{% extends "layout.html" %}
{% block ext_script %}{% endblock %}
{% block page_content %}
<div class="lf-card-center-wrapper"
     data-lf-error="{{ (error or '') | _ }}"
     data-lf-success="{{ (success or '') | _ }}">
    <div class="lf-card lf-card-center">
        <div class="lf-card-header">
            <div class="lf-card-title">{{ 'auth.register' | _ }}</div>
            <div class="lf-card-subtitle">{{ 'auth.registerSubtitle' | _ }}<fluent-link href="/login">{{ 'auth.loginNow' | _ }}</fluent-link></div>
        </div>
        <div class="lf-card-content">
            <form method="POST" action="/api/v1/register" class="lf-form">
                <fluent-text-input type="email" name="email" class="lf-card-input" autofocus required>
                    <fluent-label weight="regular" size="medium" required>
                        {{ 'auth.email' | _ }}
                    </fluent-label>
                </fluent-text-input>
                <fluent-text-input type="text" name="username" class="lf-card-input" required>
                    <fluent-label weight="regular" size="medium" required>
                        {{ 'auth.username' | _ }}
                    </fluent-label>
                </fluent-text-input>
                <fluent-text-input type="password" name="password" class="lf-card-input" required>
                    <fluent-label weight="regular" size="medium" required>
                        {{ 'auth.password' | _ }}
                    </fluent-label>
                </fluent-text-input>
                <fluent-button appearance="primary" type="submit">
                    {{ 'auth.register' | _ }}
                </fluent-button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
