{% extends "layout.html" %}
{% block ext_script %}{% endblock %}
{% block page_content %}
<div class="lf-section lf-section-7-3">
    <div class="lf-post lf-post-main">
        <h1 class="lf-post-title">{{ post_doc.title }}</h1>
        <div class="lf-avatar-wrapper">
            <fluent-avatar
                size="small"
            >
                {% if author.avatar %}
                <img role="presentation" aria-hidden="true" src="{{ author.avatar }}" />
                {% endif %}
            </fluent-avatar>
            <span class="lf-username">{{ author.username }}</span>
        </div>
        <div class="lf-post-content">
            {{ post_doc.content | markdown | safe }}
        </div>
    </div>
    <div class="lf-post lf-post-sidebar">
        <fluent-menu>
            <fluent-menu-button slot="trigger" appearance="primary" tabindex="0" aria-haspopup="true" aria-expanded="false">
                帖子操作
            </fluent-menu-button>
            <fluent-menu-list focusgroup="menu" popover >
                <fluent-menu-item tabindex="0" role="menuitem">
                Menu item 1
                </fluent-menu-item>
                <fluent-menu-item tabindex="0" role="menuitem">
                Menu item 2
                </fluent-menu-item>
                <fluent-menu-item tabindex="0" role="menuitem">
                Menu item 3
                </fluent-menu-item>
                <fluent-menu-item tabindex="0" role="menuitem">
                Menu item 4
                </fluent-menu-item>
            </fluent-menu-list>
        </fluent-menu>
    </div>
</div>
{% endblock %}
