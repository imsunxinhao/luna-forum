<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Luna Forum">
<html lang="{{ lang }}">

<head>
    <title>{% block title %}{{ site.name }} - {{ pagename }}{% endblock %}</title>
    {% block ext_script %}{% endblock %}
    <script src="{{ bundlePath }}"></script>
    <link rel="stylesheet" href="{{ stylePath }}">
</head>

<body>
    <aside class="lf-sidebar" data-lf-drawer-target="lf-sidebar">
        <div class="lf-header">
            <div class="lf-logo"><span class="lf-logo-text">{{ title }}</span></div>
            <button class="lf-toggle" data-lf-drawer-toggle="lf-sidebar">
                <span>
                    <iconify-icon icon="fluent:ios-arrow-ltr-24-regular"></i>
                </span>
            </button>
        </div>
        <nav class="lf-nav">
            <div class="lf-nav-item" data-title="{{ 'layout.home' | _ }}">
                <span class="lf-nav-icon"><iconify-icon icon="fluent:home-24-regular"></iconify-icon></span>
                <span class="lf-nav-label">{{ 'layout.home' | _ }}</span>
            </div>
        </nav>
        <div class="lf-footer">
            <div class="lf-user">
                <fluent-avatar data-color="neutral" class="lf-avatar" {% if user and user.avatar %} src="{{ user.avatar }}" {% else %} initials="{{ user.username[0]|upper if user else '' }}" {% endif %}></fluent-avatar>
                <div class="lf-user-info">
                    {% if user %}
                    <div class="lf-user-row">
                        <div class="lf-user-name">{{ user.username }}</div>
                        <fluent-menu style="--menu-max-height: auto;">
                            <fluent-menu-button aria-label="{{ 'layout.toggleMenu' | _ }}" appearance="transparent" slot="trigger"
                                tabindex="0" aria-haspopup="true" aria-expanded="false" shape="circular">
                            </fluent-menu-button>
                            <fluent-menu-list focusgroup="menu" popover>
                                    <form method="post" action="/api/v1/logout"></form>
                                    <fluent-menu-item tabindex="0" role="menuitem" type="submit" onclick="this.previousElementSibling.submit()">
                                        <iconify-icon icon="fluent:sign-out-24-filled"></iconify-icon>
                                        {{ 'layout.logout' | _ }}
                                    </fluent-menu-item>
                        </fluent-menu>
                    </div>
                    {% else %}
                    <div class="lf-user-name">{{ 'layout.notLoggedIn' | _ }}</div>
                    <div class="lf-user-role"><fluent-link href="/login" tabindex="0">{{ 'layout.loginLink' | _ }}</fluent-link></div>
                    {% endif %}
                </div>
            </div>
            <fluent-avatar data-color="neutral" class="lf-mini-avatar" {% if user and user.avatar %} src="{{ user.avatar }}" {% else %} initials="{{ user.username[0]|upper if user else '' }}" {% endif %}></fluent-avatar>
        </div>
    </aside>
    <main class="lf-content-area">
        <header class="lf-topbar">
            <button class="lf-menu-toggle" data-lf-drawer-menu="lf-sidebar">
                <iconify-icon icon="fluent:line-horizontal-3-20-regular"></iconify-icon>
            </button>
            <h1 class="lf-title" data-lf-drawer-title>{{ pagename }}</h1>
        </header>
        <div class="lf-content">
            {% block page_content %}{% endblock %}
        </div>
    </main>
    <div class="lf-overlay" data-lf-drawer-overlay></div>
</body>

</html>
