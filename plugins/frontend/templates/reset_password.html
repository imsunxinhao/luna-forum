{% extends "layout.html" %}
{% block ext_script %}{% endblock %}
{% block page_content %}
<div class="lf-card-center-wrapper">
    <div class="lf-card lf-card-center">
        <div class="lf-card-header">
            <div class="lf-card-title">{{ 'auth.resetPassword' | _ }}</div>
            <div class="lf-card-subtitle">{{ 'auth.resetSubtitle' | _ }}<fluent-link href="/login">{{ 'auth.backToLogin' | _ }}</fluent-link></div>
            {% if error %}
            <fluent-message-bar intent="error">
                {{ error | _ }}
            </fluent-message-bar>
            {% endif %}
        </div>
        <div class="lf-card-content">
            <form method="POST" action="/api/v1/password/reset" class="lf-form">
                <input type="hidden" name="token" value="{{ token }}">
                <fluent-text-input type="password" name="password" class="lf-card-input" autofocus required>
                    <fluent-label weight="regular" size="medium" required>
                        {{ 'auth.newPassword' | _ }}
                    </fluent-label>
                </fluent-text-input>
                <fluent-button appearance="primary" type="submit">
                    {{ 'auth.resetPassword' | _ }}
                </fluent-button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
